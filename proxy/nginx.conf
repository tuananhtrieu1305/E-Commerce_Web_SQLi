# WAF: Ẩn thông tin phiên bản Nginx để tránh bị dò quét lỗ hổng
server_tokens off;

# WAF: Giới hạn dung lượng request (ngăn chặn upload file rác khổng lồ gây đầy ổ cứng)
client_max_body_size 5M;

# WAF: Cấu hình Rate Limiting (Chống Spam / DDoS)
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    # Enable ModSecurity and point to ModSecurity config
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity/modsecurity.conf;

    # WAF: Bật Rate Limit cho toàn bộ Server
    limit_req zone=mylimit burst=10 nodelay;

    # WAF: Include danh sách chặn IP
    include /etc/nginx/blocked_ips.conf;

    location /lb-health {
        proxy_pass http://load-balancer/lb-health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/secure/ {
        proxy_pass http://load-balancer/api/secure/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/vuln/ {
        proxy_pass http://load-balancer/api/vuln/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8888/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}