# Simple custom SQLi detection rule for prototype (very generic)
SecRule ARGS|ARGS_NAMES|REQUEST_HEADERS|REQUEST_COOKIES "(?i:(union\s+select|select\s+.*from|information_schema|update\s+.*set|delete\s+from|--\s|;\s*drop\s+table))" \
    "id:900010,phase:2,deny,log,msg:'Potential SQL Injection',severity:2"
