# Refined SQLi detection rules to reduce false positives.
# - Restrict matching to common input parameter names (q, search, query, id, username, email, comment)
# - Apply transformations to normalize inputs
# - Use CRS anomaly scoring (setvar:tx.inbound_anomaly_score) instead of immediate deny
#   so that multiple indicators or CRS rules together trigger blocking.

# Keywords in sensitive parameters -> moderate score
SecRule ARGS:q|ARGS:search|ARGS:query|ARGS:id|ARGS:username|ARGS:user|ARGS:email|ARGS:comment "@rx (?i:(union\s+select|select\s+.*\sfrom|information_schema|update\s+.*\sset|delete\s+from|insert\s+into))" \
    "id:900010,phase:2,log,pass,t:urlDecodeUni,t:normalizePath,t:compressWhitespace,msg:'Potential SQL Injection - keywords in sensitive param',severity:2,tag:'application-multi',tag:'attack-sqli',setvar:'tx.inbound_anomaly_score=+3'"

# Strong indicators (comments, separators, explicit UNION SELECT) -> high score
SecRule ARGS:q|ARGS:search|ARGS:query|ARGS:id|ARGS:username|ARGS:user|ARGS:email|ARGS:comment "@rx (?i:(union\s+select|--|;|/\*|\*/))" \
    "id:900011,phase:2,log,pass,t:urlDecodeUni,t:normalizePath,t:compressWhitespace,msg:'SQLi strong indicator - meta chars',severity:2,tag:'application-multi',tag:'attack-sqli',setvar:'tx.inbound_anomaly_score=+5'"

# NOTE: Adjust the ARGS list to match your application's parameter names. These rules avoid
# matching unrelated headers/cookies and rely on CRS anomaly thresholds to decide blocking.
