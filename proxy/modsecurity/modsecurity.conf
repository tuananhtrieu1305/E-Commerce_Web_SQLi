# Minimal ModSecurity config for prototype
SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072

# Include default recommended rules
Include /usr/share/modsecurity-crs/owasp-crs.load

# Include local CRS setup and custom rules directory
Include /etc/modsecurity/crs-setup.conf
Include /etc/modsecurity/rules/*.conf

# Use custom OWASP CRS rules path (if any left over)
# Include /etc/nginx/rules/*.conf

# Basic actions
SecDefaultAction "phase:2,deny,log"
