# ============================================================
# Backend-Secure — Production-grade Application Properties
# ============================================================

server.port=8082

# ✅ SECURE: validate → chỉ validate schema, KHÔNG auto-create/update table
# Tránh DDL injection và unintended schema changes
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# ✅ SECURE: Tắt show-sql → tránh leak SQL query vào log (production)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.profiles.active=uat

application.security.jwt.secret-key=${JWT_SECRET:a1B2c3D4e5F6g7H8i9J0k1L2m3N4o5P6q7R8s9T0u1V2w3X4y5Z6}
application.security.jwt.expiration=86400000

# ✅ SECURE: Gemini API (thay thế Ollama)
# API Key đọc từ env variable, KHÔNG hardcode trong properties
gemini.api.key=${GEMINI_API_KEY:AIzaSyAL9yxn2DjoPt8yQpAuoBtbI1VDtDDc-lU}

# ✅ SECURE: Chỉ expose health endpoint, ẩn mappings và internal endpoints
management.endpoints.web.exposure.include=health
spring.main.allow-bean-definition-overriding=true

# ✅ SECURE: Tắt debug logging cho request filter
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=WARN

# ✅ SECURE: Tắt stacktrace trong error response
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
